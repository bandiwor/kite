[package]
name = "kite"
version = "0.1.0"
edition = "2021"
description = "Kite: a small, fast, dynamically typed, expression-oriented language with a register-based bytecode VM"
license = "MIT"

[lib]
name = "kite"
path = "src/lib.rs"

[[bin]]
name = "kite"
path = "src/main.rs"

[features]
# Count executed opcodes and opcode pairs (printed at exit); for choosing superinstructions.
op-profile = []
# Use the system allocator instead of the small-object pool (for valgrind / sanitizers).
system-alloc = []

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1

[profile.test]
opt-level = 1
